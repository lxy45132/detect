server:
  port: 8082

spring:
  application:
    name: detect-event
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/detect_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
  # 资源服务器：用 auth 暴露的 JWK Set 验签网关透传的 JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 对象存储(MinIO)：receive 接口把 snapImage base64 转存为 snapUrl；读出侧返回预签名 URL
detect:
  oss:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:detect}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    # 预签名有效期(秒)：桶保持私有，列表/详情把库里稳定 URL 换成限时签名 URL，
    # 浏览器 <img> 无需凭据即可取图（不会带 Authorization 头，所以不能走 JWT 代理）。
    # 注意：public-url 必须是**浏览器可达**的地址，签名 URL 的 host 取自它。
    presign-expire-seconds: ${MINIO_PRESIGN_EXPIRE:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.detect: debug
